name: Solana Scanner
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v3 yerine v4 yaptık
      - name: Python Kurulum
        uses: actions/setup-python@v5 # v4 yerine v5 yaptık
        with:
          python-version: '3.10'
      - name: Gerekli Paketler
        run: pip install aiohttp requests
      - name: Botu Çalıştır
        run: python 2.py
